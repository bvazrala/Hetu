[project]
name = "hetu-backend"
version = "0.1.0"
description = "API for Hetu, a reasoning workspace for students."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.38",
    "fastapi>=0.115",
    "langchain-groq>=1.1.3",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=1.0",
    "pytest>=8.3",
]

# The backend is run in place and is not built as an installable package.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
